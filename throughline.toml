[project]
name = "Rent-arrears procedure note (content-compose practitioner example)"
format_version = 2

# A second worked example of a *composed* content project — the practitioner-and-neutral
# counterpart to `content-compose-example` (which is general-and-formal). Same council
# housing domain, different reader and register: this is an INTERNAL procedure note that
# a HOUSING OFFICER follows to work a rent-arrears case, not a tenant-facing help page.
# It is an ordinary throughline project — its own intent, user requirements and system
# requirements live under intents/, user-requirements/ and system-requirements/ — that
# additionally adopts FIVE orthogonal content standards by reference and cites their
# clauses on the system requirements they satisfy:
#   - Plain-language (readability)        namespace `plain`
#   - British-English conventions         namespace `conventions`
#   - Tone — neutral register             namespace `tone`
#   - Purpose — instruct                  namespace `purpose`
#   - Audience — practitioner reader      namespace `audience`
#
# This is the orthogonality payoff, and the sibling-swap payoff. The tenant help page
# composes the FORMAL register and the GENERAL-reader audience; this staff procedure
# note composes the NEUTRAL register and the PRACTITIONER audience — the reader knows
# the housing-management workflow and its common vocabulary but not the deep legal
# theory. Moving from one worked example to the other is exactly two one-line `ref`
# swaps on the `tone` and `audience` sources; the readability, conventions and purpose
# axes are untouched. The five sources never collide even though each numbers its items
# SR-0001 upward, because each is imported under its own namespace.
#
# Note the deliberate tension between two of these axes: `plain` is UNIVERSAL clarity
# for any reader, while `audience` tunes how much prior knowledge and field vocabulary
# the writing may assume for a SPECIFIC reader. They are independent and both compose.
#
# Drive this project with `tl-compose`, never bare `tl`: the composition-aware `check`
# merges the sources into one union graph and validates it. Bare `tl` fails fast the
# moment it meets a namespace-qualified reference it cannot resolve.
#
# Each source is adopted BY REFERENCE — a git `url` pinned to an edition `ref` — never
# vendored or copied. tl-compose fetches the pinned ref into a per-user cache outside
# this project, so this project's own item scan never sees the borrowed graphs. Moving
# to a newer edition of a source is a one-line `ref` change here.
[[sources]]
namespace = "plain"
url = "https://github.com/rhodium-org/throughline-plain-language"
ref = "v2026-07"

[[sources]]
namespace = "conventions"
url = "https://github.com/rhodium-org/throughline-conventions-uk"
ref = "v2026-07"

[[sources]]
namespace = "tone"
url = "https://github.com/rhodium-org/throughline-tone-neutral"
ref = "v2026-07"

[[sources]]
namespace = "purpose"
url = "https://github.com/rhodium-org/throughline-purpose-instruct"
ref = "v2026-07"

[[sources]]
namespace = "audience"
url = "https://github.com/rhodium-org/throughline-audience-practitioner"
ref = "v2026-07"

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "implements"]
ai_origins = ["ai", "hybrid"]

# The union is governed by THIS schema, so the consumer must declare types, links and
# statuses that are a superset of what every source uses internally. All five sources
# mark source_ref required and carry a `principle` grouping attr on their rules; here
# those are optional, which still accepts the sources' items while not forcing this
# project's own items to carry them.
[types.user_requirement]
attrs.source_ref = { required = false }

[types.system_requirement]
attrs.source_ref = { required = false }
attrs.principle  = { required = false }

[links]
types = ["derives_from", "implements", "satisfies", "relates"]

[link_rules]
derives_from = { from = ["user_requirement"], to = ["intent"] }
implements   = { from = ["system_requirement"], to = ["user_requirement"] }
# The borrowed-clause link: a note requirement satisfies a plain-language, conventions,
# tone, purpose or audience rule. `satisfies` is a traceability link, not a grounding
# link, so a note SR still grounds through `implements`, not the standard.
satisfies    = { from = ["system_requirement"], to = ["system_requirement"] }

[status]
values = ["proposed", "draft", "deferred", "approved", "ratified", "implemented",
          "verified", "suspect", "rejected", "deleted"]

[transitions]
proposed    = ["draft", "approved", "ratified", "deferred", "rejected", "deleted"]
draft       = ["approved", "deferred", "rejected", "deleted"]
deferred    = ["draft", "approved", "rejected", "deleted"]
approved    = ["ratified", "implemented", "deferred", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["approved", "ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]
